var stage=document.getElementById('stage'),scene=document.getElementById('scene');
var W,H;
function size(){W=Math.min(window.innerWidth*0.5,window.innerHeight*0.5*982/1280,330);H=W*1280/982;

size();window.addEventListener('resize',size);
var chips=[],N=18,L=[-0.45,-0.6,0.66],ll=Math.hypot(L[0],L[1],L[2]);L=L.map(function(v){return v/ll});
function rnd(a,b){return a+Math.random()*(b-a)}
for(var i=0;i<N;i++){
 var tx=TEX[i%3],el=document.createElement('div');el.className='chip';
 var flip=Math.random()<.5?-1:1;
 var html='';
 for(var k=-1;k<=1;k++){html+='<i class="r" style="background-image:url('+tx.u+');transform:translateZ('+k+'px) scale(.97)"></i>';}
 html+='<i class="f" style="background-image:url('+tx.u+');transform:translateZ(2px) scaleX('+flip+')"></i>';
 html+='<i class="b" style="background-image:url('+tx.u+');transform:rotateY(180deg) translateZ(2px) scaleX('+flip+')"></i>';
 el.innerHTML=html;stage.appendChild(el);
 var ring=i%3;
 chips.push({el:el,f:el.querySelector('.f'),b:el.querySelector('.b'),a:tx.a,s:rnd(0.17,0.26),

}

 var dt=Math.min(.05,(now-last)/1000);last=now;if(!paused&&!reduce)t+=dt;
 rx+=(tx_-rx)*0.08;ry+=(ty-ry)*0.08;
 stage.style.transform='rotateX('+rx+'deg) rotateY('+ry+'deg)';
 for(var i=0;i<chips.length;i++){var c=chips[i],a=c.phase+t*c.speed;
  var R=c.r*W,x=Math.cos(a)*R,z=Math.sin(a)*R,y=c.y*H+Math.sin(t*c.bob+c.phase)*0.03*H;
  var w=c.s*W,h=w/c.a;
  if(c.sz!==w){c.sz=w;c.el.style.width=w+'px';c.el.style.height=h+'px';c.el.style.margin=(-h/2)+'px 0 0 '+(-w/2)+'px';}
  var ax=c.ox+t*c.sx,ay=c.oy+t*c.sy;
  c.el.style.transform='translate3d('+x+'px,'+y+'px,'+z+'px) rotateX('+ax+'deg) rotateY('+ay+'deg)';
  var X=ax*Math.PI/180,Y=ay*Math.PI/180;
  var nx=Math.sin(Y),ny=-Math.cos(Y)*Math.sin(X),nz=Math.cos(Y)*Math.cos(X);

  var sf=(0.6+0.5*df+0.45*Math.pow(df,14))*depth,sb=(0.6+0.5*db+0.45*Math.pow(db,14))*depth;
  c.f.style.filter='brightness('+sf.toFixed(3)+')';c.b.style.filter='brightness('+sb.toFixed(3)+')';
 }
 requestAnimationFrame(frame);}
