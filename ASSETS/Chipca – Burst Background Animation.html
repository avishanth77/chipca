<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chipca – Classic Chips</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg1:#3c2d2e;--bg2:#2a2022;--fg:#f3e3cc}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:radial-gradient(circle at 50% 50%,var(--bg1),var(--bg2) 75%);overflow:hidden;font-family:system-ui,sans-serif}
svg{width:100%;height:100%;display:block;overflow:visible}
.ray{transform-box:fill-box;transform-origin:center;opacity:0;animation:burst 1s cubic-bezier(.2,1.25,.4,1) var(--d) forwards,breathe 5s ease-in-out calc(var(--d) + 1.2s) infinite alternate}
@keyframes burst{0%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(.25) rotate(var(--r))}25%{opacity:1}100%{opacity:1;transform:none}}
@keyframes breathe{from{transform:scale(1)}to{transform:scale(1.035) rotate(.6deg)}}
#bag{transform-box:fill-box;transform-origin:50% 60%;animation:pop 1.1s cubic-bezier(.2,1.4,.4,1) both}
#float{animation:float 4s ease-in-out 2.2s infinite alternate}
@keyframes pop{0%{opacity:0;transform:scale(.8) translateY(60px)}50%{opacity:1}100%{opacity:1;transform:none}}
@keyframes float{from{transform:translateY(0)}to{transform:translateY(-10px)}}
.replay{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#d9382c;color:#fff;border:0;border-radius:999px;padding:12px 26px;font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 6px 18px #0006}
@media (prefers-reduced-motion:reduce){.ray,#bag,#float{animation:none;opacity:1}}
</style></head><body>
